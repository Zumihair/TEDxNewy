<!-- @dsCard group="Brand" viewport="700x150" name="Grain & texture" subtitle="Very low opacity noise; multiply on cream, screen on dark" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cream);font-family:var(--font-sans);padding:20px}.g{display:flex;gap:0;border-radius:8px;overflow:hidden}.sw{flex:1;height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;font-size:9.5px;letter-spacing:.06em}.sw b{display:block;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}.hex{opacity:.75;font-variant-numeric:tabular-nums}.lbl{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;color:var(--ink-4);margin:0 0 10px}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}</style>
</head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="grain" style="height:100px;border-radius:8px;background:var(--cream-deep);display:flex;align-items:flex-end;padding:10px;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)">Multiply · 5&#37;</div>
<div class="grain grain-dark" style="height:100px;border-radius:8px;background:var(--red-deep);display:flex;align-items:flex-end;padding:10px;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6)">Screen · 10&#37;</div></div></body></html>
