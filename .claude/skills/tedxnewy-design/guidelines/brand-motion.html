<!-- @dsCard group="Brand" viewport="700x160" name="Motion" subtitle="One easing curve, fades and gentle rises, 1-2px hover lift" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cream);font-family:var(--font-sans);padding:20px}.g{display:flex;gap:0;border-radius:8px;overflow:hidden}.sw{flex:1;height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;font-size:9.5px;letter-spacing:.06em}.sw b{display:block;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}.hex{opacity:.75;font-variant-numeric:tabular-nums}.lbl{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;color:var(--ink-4);margin:0 0 10px}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}</style>
</head><body><div style="display:grid;gap:12px">
<div class="row" style="gap:16px"><span style="font-size:11.5px;color:var(--ink-3);width:150px">cubic-bezier(.22,1,.36,1)</span><svg width="120" height="44" viewBox="0 0 120 44"><path d="M2 42 C 28 2, 46 2, 118 2" fill="none" stroke="#e02214" stroke-width="2"/></svg><span style="font-size:11.5px;color:var(--ink-4)">Every transition, 300ms</span></div>
<div class="row" style="gap:16px"><span style="font-size:11.5px;color:var(--ink-3);width:150px">rise (entrance)</span><span style="font-size:11.5px;color:var(--ink-4)">opacity 0 &rarr; 1, translateY 24px &rarr; 0, 950ms, staggered 120ms</span></div>
<div class="row" style="gap:16px"><span style="font-size:11.5px;color:var(--ink-3);width:150px">hover</span><span style="font-size:11.5px;color:var(--ink-4)">buttons lift 1px &amp; shift colour · cards lift 2px &amp; gain a soft shadow · photos zoom 3&#37; over 700ms</span></div>
<div class="row" style="gap:16px"><span style="font-size:11.5px;color:var(--ink-3);width:150px">press</span><span style="font-size:11.5px;color:var(--ink-4)">no separate press state; the hover colour holds</span></div></div></body></html>
