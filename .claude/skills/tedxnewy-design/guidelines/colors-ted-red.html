<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cream);font-family:var(--font-sans);padding:20px}.g{display:flex;gap:0;border-radius:8px;overflow:hidden}.sw{flex:1;height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;font-size:9.5px;letter-spacing:.06em}.sw b{display:block;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}.hex{opacity:.75;font-variant-numeric:tabular-nums}.lbl{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;color:var(--ink-4);margin:0 0 10px}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}</style>
</head><body><div class="row" style="align-items:stretch"><div class="g" style="flex:1"><div class="sw" style="background:#e62b1e;color:#fff"><b>TED red · Pantone 485</b><span class="hex">#e62b1e</span></div><div class="sw" style="background:#000000;color:#fff"><b>Black</b><span class="hex">#000000</span></div><div class="sw" style="background:#ffffff;color:#141210"><b>White</b><span class="hex">#ffffff</span></div></div></div>
<p style="margin:12px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink-3);max-width:64ch">Official TEDx materials use TED red, black and white, set in Arial. Pull the exact red from the official logo files, never from a screen. The cream-and-ink palette is a website system and does not replace it.</p></body></html>
