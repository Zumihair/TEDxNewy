<!-- @dsCard group="Colors" viewport="700x140" name="Cream & ink" subtitle="The default surface pair: cream backgrounds, near-black text" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cream);font-family:var(--font-sans);padding:20px}.g{display:flex;gap:0;border-radius:8px;overflow:hidden}.sw{flex:1;height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;font-size:9.5px;letter-spacing:.06em}.sw b{display:block;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}.hex{opacity:.75;font-variant-numeric:tabular-nums}.lbl{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;color:var(--ink-4);margin:0 0 10px}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}</style>
</head><body><div class="g"><div class="sw" style="background:#f9f5ec;color:#141210"><b>Cream light</b><span class="hex">#f9f5ec</span></div><div class="sw" style="background:#f4efe6;color:#141210"><b>Cream</b><span class="hex">#f4efe6</span></div><div class="sw" style="background:#e9e2d5;color:#141210"><b>Cream deep</b><span class="hex">#e9e2d5</span></div><div class="sw" style="background:#6b6459;color:#fff"><b>Ink 3</b><span class="hex">#6b6459</span></div><div class="sw" style="background:#2a2521;color:#fff"><b>Ink 2</b><span class="hex">#2a2521</span></div><div class="sw" style="background:#141210;color:#fff"><b>Ink</b><span class="hex">#141210</span></div></div></body></html>
