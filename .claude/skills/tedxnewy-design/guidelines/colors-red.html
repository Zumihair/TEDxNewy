<!-- @dsCard group="Colors" viewport="700x140" name="Red family" subtitle="One confident red; deep maroon for premium dark sections" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cream);font-family:var(--font-sans);padding:20px}.g{display:flex;gap:0;border-radius:8px;overflow:hidden}.sw{flex:1;height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;font-size:9.5px;letter-spacing:.06em}.sw b{display:block;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}.hex{opacity:.75;font-variant-numeric:tabular-nums}.lbl{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;color:var(--ink-4);margin:0 0 10px}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}</style>
</head><body><div class="g"><div class="sw" style="background:#e02214;color:#fff"><b>Red</b><span class="hex">#e02214</span></div><div class="sw" style="background:#ff3626;color:#2a0604"><b>Red bright</b><span class="hex">#ff3626</span></div><div class="sw" style="background:#b91404;color:#fff"><b>Red mid</b><span class="hex">#b91404</span></div><div class="sw" style="background:#8c0d05;color:#fff"><b>Red dark</b><span class="hex">#8c0d05</span></div><div class="sw" style="background:#3d0a05;color:rgba(255,255,255,.85)"><b>Red section</b><span class="hex">#3d0a05</span></div><div class="sw" style="background:#2a0604;color:rgba(255,255,255,.85)"><b>Red deep</b><span class="hex">#2a0604</span></div></div></body></html>
