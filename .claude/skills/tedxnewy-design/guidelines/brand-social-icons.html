<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cream);font-family:var(--font-sans);padding:20px}.g{display:flex;gap:0;border-radius:8px;overflow:hidden}.sw{flex:1;height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;font-size:9.5px;letter-spacing:.06em}.sw b{display:block;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}.hex{opacity:.75;font-variant-numeric:tabular-nums}.lbl{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;color:var(--ink-4);margin:0 0 10px}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}</style>
</head><body><div class="row" style="gap:20px">
<div class="row" style="background:var(--ink);border-radius:8px;padding:14px 18px;gap:10px"><span style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid rgba(255,255,255,.15)"><img src="../../../../public/brand/social/instagram.png" alt="instagram" style="width:16px;height:16px;opacity:.75"></span><span style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid rgba(255,255,255,.15)"><img src="../../../../public/brand/social/linkedin.png" alt="linkedin" style="width:16px;height:16px;opacity:.75"></span><span style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid rgba(255,255,255,.15)"><img src="../../../../public/brand/social/tiktok.png" alt="tiktok" style="width:16px;height:16px;opacity:.75"></span></div>
<div class="row" style="background:#fff;border:1px solid var(--line-hairline);border-radius:8px;padding:14px 18px;gap:12px"><img src="../../../../public/brand/social/instagram-red.png" alt="instagram-red" style="width:20px;height:20px"><img src="../../../../public/brand/social/linkedin-red.png" alt="linkedin-red" style="width:20px;height:20px"></div></div>
<p style="margin:12px 0 0;font-size:11.5px;color:var(--ink-4)">UI iconography is Lucide (24px, 2px stroke, round caps) — see the Icon component. Emoji are never used.</p></body></html>
