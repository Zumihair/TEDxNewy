<!-- @dsCard group="Brand" viewport="700x170" name="Radii & shadows" subtitle="8px cards, 12/24px photo panels, 999px pills; warm-tinted shadows" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cream);font-family:var(--font-sans);padding:20px}.g{display:flex;gap:0;border-radius:8px;overflow:hidden}.sw{flex:1;height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;font-size:9.5px;letter-spacing:.06em}.sw b{display:block;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}.hex{opacity:.75;font-variant-numeric:tabular-nums}.lbl{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;color:var(--ink-4);margin:0 0 10px}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}</style>
</head><body><div class="row" style="gap:14px;align-items:flex-start">
<div style="text-align:center"><div style="width:110px;height:74px;background:#fff;border:1px solid var(--line-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-card-hover)"></div><div style="margin-top:8px;font-size:10px;color:var(--ink-4)">8px card</div></div><div style="text-align:center"><div style="width:110px;height:74px;background:#fff;border:1px solid var(--line-hairline);border-radius:var(--radius-md);box-shadow:var(--shadow-md)"></div><div style="margin-top:8px;font-size:10px;color:var(--ink-4)">12px panel</div></div><div style="text-align:center"><div style="width:110px;height:74px;background:#fff;border:1px solid var(--line-hairline);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)"></div><div style="margin-top:8px;font-size:10px;color:var(--ink-4)">24px photo</div></div><div style="text-align:center"><div style="width:110px;height:74px;background:#fff;border:1px solid var(--line-hairline);border-radius:var(--radius-input);box-shadow:var(--shadow-sm)"></div><div style="margin-top:8px;font-size:10px;color:var(--ink-4)">16px field</div></div>
<div style="text-align:center"><div style="width:110px;height:74px;border-radius:999px;background:var(--red);box-shadow:var(--shadow-red-circle)"></div><div style="margin-top:8px;font-size:10px;color:var(--ink-4)">999px pill</div></div></div></body></html>
