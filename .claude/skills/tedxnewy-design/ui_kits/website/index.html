<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>html,body{margin:0;height:100%;overflow:hidden}#root{height:100%}
.switcher{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(20,18,16,.88);backdrop-filter:blur(20px) saturate(140%);box-shadow:0 18px 60px rgba(20,18,16,.35)}
.switcher button{border:0;background:none;border-radius:999px;padding:9px 16px;font-family:var(--font-sans);font-size:12.5px;font-weight:500;color:rgba(255,255,255,.7);cursor:pointer;transition:all .3s cubic-bezier(.22,1,.36,1)}
.switcher button:hover{color:#fff}
.switcher button[data-on="true"]{background:var(--red);color:#fff}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="EventScreen.jsx"></script>
<script type="text/babel" src="EventsScreen.jsx"></script>
<script type="text/babel" src="ParticipateScreen.jsx"></script>
<script type="text/babel" data-presets="react">
const SCREENS = [["home", "Home"], ["signal", "Signal"], ["events", "Archive"], ["participate", "Nominate"]];
function App() {
  const [route, setRoute] = React.useState("home");
  const Screen = { home: HomeScreen, signal: EventScreen, events: EventsScreen, participate: ParticipateScreen }[route];
  return (
    <>
      <Screen key={route} onNavigate={setRoute} />
      <nav className="switcher">
        {SCREENS.map(([k, label]) => (
          <button key={k} data-on={route === k} onClick={() => setRoute(k)}>{label}</button>
        ))}
      </nav>
    </>
  );
}
const start = () => { if (window.HomeScreen && window.TEDxNewyDesignSystem_0329fe) ReactDOM.createRoot(document.getElementById("root")).render(<App />); else setTimeout(start, 50); };
start();
</script>
</body></html>
