<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing scale" subtitle="Tailwind's 4px scale, but the admin lives on the half-steps: 6, 10, 14" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:8px;flex-wrap:wrap}.col{display:grid;gap:8px}
.sw{border-radius:var(--radius-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box}
.mono{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.16em}
.hex{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink-4)}
.name{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-4)}
</style></head><body><div class="col" style="gap:6px">
<div style="display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px"><span class="name">2px</span><span style="height:8px;width:12px;background:var(--section-ink);opacity:.5;border-radius:2px"></span></div><div style="display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px"><span class="name">4px</span><span style="height:8px;width:24px;background:var(--section-ink);opacity:.5;border-radius:2px"></span></div><div style="display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px"><span class="name">6px</span><span style="height:8px;width:36px;background:var(--section-ink);opacity:.5;border-radius:2px"></span></div><div style="display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px"><span class="name">8px</span><span style="height:8px;width:48px;background:var(--section-ink);opacity:.5;border-radius:2px"></span></div><div style="display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px"><span class="name">10px</span><span style="height:8px;width:60px;background:var(--section-ink);opacity:.5;border-radius:2px"></span></div><div style="display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px"><span class="name">12px</span><span style="height:8px;width:72px;background:var(--section-ink);opacity:.5;border-radius:2px"></span></div><div style="display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px"><span class="name">14px</span><span style="height:8px;width:84px;background:var(--section-ink);opacity:.5;border-radius:2px"></span></div><div style="display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px"><span class="name">16px</span><span style="height:8px;width:96px;background:var(--section-ink);opacity:.5;border-radius:2px"></span></div><div style="display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px"><span class="name">20px</span><span style="height:8px;width:120px;background:var(--section-ink);opacity:.5;border-radius:2px"></span></div><div style="display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px"><span class="name">24px</span><span style="height:8px;width:144px;background:var(--section-ink);opacity:.5;border-radius:2px"></span></div><div style="display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px"><span class="name">32px</span><span style="height:8px;width:192px;background:var(--section-ink);opacity:.5;border-radius:2px"></span></div><div style="display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px"><span class="name">40px</span><span style="height:8px;width:240px;background:var(--section-ink);opacity:.5;border-radius:2px"></span></div>
</div></body></html>
