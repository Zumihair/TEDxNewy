<!-- @dsCard group="Colors" viewport="700x140" name="Ink scale" subtitle="One warm near-black, four muted steps down. Never a neutral grey hex." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Ink</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:8px;flex-wrap:wrap}.col{display:grid;gap:8px}
.sw{border-radius:var(--radius-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box}
.mono{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.16em}
.hex{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink-4)}
.name{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-4)}
</style></head><body><div class="row" style="gap:10px">
<div class="col" style="gap:4px"><div class="sw" style="background:var(--ink);color:#fff"><span class="mono">ink · titles</span></div><span class="hex">#141210</span></div>
<div class="col" style="gap:4px"><div class="sw" style="background:var(--ink-2);color:#fff"><span class="mono">ink 2 · body</span></div><span class="hex">#2a2521</span></div>
<div class="col" style="gap:4px"><div class="sw" style="background:var(--ink-3);color:#fff"><span class="mono">ink 3 · muted</span></div><span class="hex">#6b6459</span></div>
<div class="col" style="gap:4px"><div class="sw" style="background:var(--ink-4);color:#fff"><span class="mono">ink 4 · faint</span></div><span class="hex">#8a8278</span></div>
<div class="col" style="gap:4px"><div class="sw" style="background:var(--ink-5);color:#fff"><span class="mono">ink 5 · placeholder</span></div><span class="hex">#9a9186</span></div>
</div></body></html>
