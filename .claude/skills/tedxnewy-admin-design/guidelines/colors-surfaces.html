<!-- @dsCard group="Colors" viewport="700x140" name="Surfaces" subtitle="Cream page, white cards, the near-black sidebar" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Surfaces</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:8px;flex-wrap:wrap}.col{display:grid;gap:8px}
.sw{border-radius:var(--radius-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box}
.mono{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.16em}
.hex{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink-4)}
.name{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-4)}
</style></head><body><div class="row" style="gap:10px">
<div class="col" style="gap:4px"><div class="sw" style="background:var(--white);color:var(--ink)"><span class="mono">white card</span></div><span class="hex">#ffffff</span></div>
<div class="col" style="gap:4px"><div class="sw" style="background:var(--cream);color:var(--ink)"><span class="mono">page</span></div><span class="hex">#f4efe6</span></div>
<div class="col" style="gap:4px"><div class="sw" style="background:var(--cream-light);color:var(--ink)"><span class="mono">sunken</span></div><span class="hex">#f9f5ec</span></div>
<div class="col" style="gap:4px"><div class="sw" style="background:var(--cream-chip);color:var(--ink)"><span class="mono">stat chip</span></div><span class="hex">#f1ede4</span></div>
<div class="col" style="gap:4px"><div class="sw" style="background:var(--sidebar-bg);color:#fff"><span class="mono">sidebar</span></div><span class="hex">#111111</span></div>
</div></body></html>
