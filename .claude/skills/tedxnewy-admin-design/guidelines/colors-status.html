<!-- @dsCard group="Colors" viewport="700x150" name="Status colours" subtitle="Derived lifecycle status and stage chips. Amber = draft/needs polish, blue = scheduled, green = done." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Status</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:8px;flex-wrap:wrap}.col{display:grid;gap:8px}
.sw{border-radius:var(--radius-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box}
.mono{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.16em}
.hex{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink-4)}
.name{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-4)}
</style></head><body><div class="row" style="gap:8px;align-items:center">
<span style="display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;background:var(--warn-bg);color:var(--warn-fg);font-family:var(--font-mono);font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.22em">Draft</span><span style="display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;background:var(--warn-bg);color:var(--warn-fg);font-family:var(--font-mono);font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.22em">Needs polish</span><span style="display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;background:var(--info-bg);color:var(--info-fg);font-family:var(--font-mono);font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.22em">Scheduled</span><span style="display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;background:var(--ok-bg);color:var(--ok-fg);font-family:var(--font-mono);font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.22em">Posted</span><span style="display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;background:var(--ok-bg);color:var(--ok-fg);font-family:var(--font-mono);font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.22em">Ready to schedule</span><span style="display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;background:var(--wash);color:var(--ink-3);font-family:var(--font-mono);font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.22em">Past</span><span style="display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;background:var(--error-bg);color:var(--error-fg);font-family:var(--font-mono);font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.22em">Failed</span>
</div>
<div class="row" style="gap:8px;margin-top:14px">
<div style="flex:1;border:1px solid var(--ok-flash-border);background:var(--ok-flash-bg);color:var(--ok-flash-fg);border-radius:var(--radius-md);padding:10px 14px;font-size:12.5px">Partner saved.</div><div style="flex:1;border:1px solid var(--info-flash-border);background:var(--info-flash-bg);color:var(--info-flash-fg);border-radius:var(--radius-md);padding:10px 14px;font-size:12.5px">Import skipped 4 duplicates.</div><div style="flex:1;border:1px solid var(--error-border);background:var(--error-bg);color:var(--error-fg);border-radius:var(--radius-md);padding:10px 14px;font-size:12.5px">That page needs full admin access.</div>
</div></body></html>
