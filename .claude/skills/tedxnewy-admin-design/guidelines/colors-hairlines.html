<!-- @dsCard group="Colors" viewport="700x170" name="Hairlines & washes" subtitle="Every border and neutral fill is ink at low alpha — the warmth comes from the alpha, not a grey" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Hairlines</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:8px;flex-wrap:wrap}.col{display:grid;gap:8px}
.sw{border-radius:var(--radius-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box}
.mono{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.16em}
.hex{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink-4)}
.name{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-4)}
</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
<div style="background:var(--surface-card);border:1px solid rgba(20,18,16,0.08);border-radius:var(--radius-md);padding:10px"><div class="name">--line</div><div class="hex" style="margin-top:4px">rgba(20,18,16,0.08)</div><div style="margin-top:6px;font-size:11px;color:var(--ink-3)">card border, row divider</div></div><div style="background:var(--surface-card);border:1px solid rgba(20,18,16,0.10);border-radius:var(--radius-md);padding:10px"><div class="name">--line-strong</div><div class="hex" style="margin-top:4px">rgba(20,18,16,0.10)</div><div style="margin-top:6px;font-size:11px;color:var(--ink-3)">tab bar, pulse tile</div></div><div style="background:var(--surface-card);border:1px solid rgba(20,18,16,0.15);border-radius:var(--radius-md);padding:10px"><div class="name">--line-input</div><div class="hex" style="margin-top:4px">rgba(20,18,16,0.15)</div><div style="margin-top:6px;font-size:11px;color:var(--ink-3)">input border</div></div><div style="background:var(--surface-card);border:1px solid rgba(20,18,16,0.18);border-radius:var(--radius-md);padding:10px"><div class="name">--line-dashed</div><div class="hex" style="margin-top:4px">rgba(20,18,16,0.18)</div><div style="margin-top:6px;font-size:11px;color:var(--ink-3)">not-set-up panel</div></div><div style="background:var(--surface-card);border:1px solid rgba(20,18,16,0.06);border-radius:var(--radius-md);padding:10px"><div class="name">--wash</div><div class="hex" style="margin-top:4px">rgba(20,18,16,0.06)</div><div style="margin-top:6px;font-size:11px;color:var(--ink-3)">secondary button, skeleton</div></div><div style="background:var(--surface-card);border:1px solid rgba(20,18,16,0.10);border-radius:var(--radius-md);padding:10px"><div class="name">--wash-hover</div><div class="hex" style="margin-top:4px">rgba(20,18,16,0.10)</div><div style="margin-top:6px;font-size:11px;color:var(--ink-3)">its hover</div></div>
</div></body></html>
