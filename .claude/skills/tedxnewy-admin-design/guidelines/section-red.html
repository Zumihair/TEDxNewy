<!-- @dsCard group="Section colours" viewport="700x150" name="Community — red" subtitle="Quick email, Calendar, Socials, Newsletter" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Community — red</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:8px;flex-wrap:wrap}.col{display:grid;gap:8px}
.sw{border-radius:var(--radius-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box}
.mono{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.16em}
.hex{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink-4)}
.name{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-4)}
</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:start">
<div class="col" style="gap:4px"><div class="sw" style="background:var(--sec-red-ink)"><span class="mono">ink</span></div><span class="hex">--sec-red-ink</span></div>
<div class="col" style="gap:4px"><div class="sw" style="background:var(--sidebar-bg);align-items:center;gap:8px"><span style="display:inline-block;width:3px;height:20px;border-radius:0 999px 999px 0;background:var(--sec-red-on-dark)"></span><span style="display:inline-flex;width:24px;height:24px;border-radius:6px;background:var(--sec-red-on-dark)"></span><span class="mono" style="color:#fff">on dark</span></div><span class="hex">--sec-red-on-dark</span></div>
<div class="col" style="gap:4px"><div class="sw" style="background:var(--sec-red-chip-bg);color:var(--sec-red-chip-fg)"><span class="mono">chip bg / fg</span></div><span class="hex">--sec-red-chip-*</span></div>
<div class="col" style="gap:4px"><div class="sw" style="background:var(--surface-card);border:2px solid var(--sec-red-border);color:var(--sec-red-ink)"><span class="mono">tile border</span></div><span class="hex">--sec-red-border</span></div>
</div></body></html>
