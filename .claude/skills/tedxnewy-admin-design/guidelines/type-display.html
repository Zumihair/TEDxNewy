<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Display</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:8px;flex-wrap:wrap}.col{display:grid;gap:8px}
.sw{border-radius:var(--radius-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box}
.mono{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.16em}
.hex{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink-4)}
.name{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-4)}
</style></head><body><div class="col" style="gap:14px">
<div><div class="name">page title · clamp(1.85rem, 3.6vw, 2.5rem) / 1.04 / -0.025em</div><div style="font-size:2.5rem;font-weight:500;letter-spacing:-0.025em;line-height:1.04;font-variation-settings:'opsz' 144;color:var(--ink)">Partners</div></div>
<div><div class="name">dashboard greeting · clamp(1.6rem, 3vw, 2rem) / -0.02em</div><div style="font-size:2rem;font-weight:500;letter-spacing:-0.02em;font-variation-settings:'opsz' 144;color:var(--ink)">Afternoon, Will.</div></div>
<div><div class="name">pulse stat · clamp(1.7rem, 2.4vw, 2.1rem) / -0.035em / tabular</div><div style="font-size:2.1rem;font-weight:500;letter-spacing:-0.035em;font-variant-numeric:tabular-nums;font-variation-settings:'opsz' 144;color:var(--red)">184/300</div></div>
</div></body></html>
