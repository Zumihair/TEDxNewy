<!-- @dsCard group="Spacing" viewport="700x160" name="Shadow scale" subtitle="Warm-tinted: ink at 4–10% alpha, never neutral black. Cards get sm; a hovered tile gets md." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:8px;flex-wrap:wrap}.col{display:grid;gap:8px}
.sw{border-radius:var(--radius-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box}
.mono{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.16em}
.hex{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink-4)}
.name{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-4)}
</style></head><body><div class="row" style="gap:16px;padding:8px 0 20px">
<div class="col" style="gap:6px"><div style="width:130px;height:60px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-hairline)"></div><span class="name">hairline</span><span class="hex">--shadow-hairline</span></div><div class="col" style="gap:6px"><div style="width:130px;height:60px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-sm)"></div><span class="name">sm · cards</span><span class="hex">--shadow-sm</span></div><div class="col" style="gap:6px"><div style="width:130px;height:60px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-md)"></div><span class="name">md · hover</span><span class="hex">--shadow-md</span></div><div class="col" style="gap:6px"><div style="width:130px;height:60px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-lg)"></div><span class="name">lg · picker</span><span class="hex">--shadow-lg</span></div>
</div></body></html>
