<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Mono caps</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:8px;flex-wrap:wrap}.col{display:grid;gap:8px}
.sw{border-radius:var(--radius-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box}
.mono{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.16em}
.hex{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink-4)}
.name{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-4)}
</style></head><body><div class="col" style="gap:12px">
<div style="display:grid;grid-template-columns:200px 1fr;align-items:baseline;gap:12px"><span class="name">10.5px · tracking .24em</span><span style="font-family:var(--font-mono);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.24em;color:var(--ink-3)">Organisation</span></div><div style="display:grid;grid-template-columns:200px 1fr;align-items:baseline;gap:12px"><span class="name">10.5px · tracking .22em</span><span style="font-family:var(--font-mono);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.22em;color:var(--ink-3)">Management</span></div><div style="display:grid;grid-template-columns:200px 1fr;align-items:baseline;gap:12px"><span class="name">9.5px · tracking .22em</span><span style="font-family:var(--font-mono);font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.22em;color:var(--ink-3)">Scheduled</span></div><div style="display:grid;grid-template-columns:200px 1fr;align-items:baseline;gap:12px"><span class="name">9.5px · tracking .28em</span><span style="font-family:var(--font-mono);font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.28em;color:var(--ink-3)">Community</span></div><div style="display:grid;grid-template-columns:200px 1fr;align-items:baseline;gap:12px"><span class="name">8.5px · tracking .10em</span><span style="font-family:var(--font-mono);font-size:8.5px;font-weight:600;text-transform:uppercase;letter-spacing:.10em;color:var(--ink-3)">Sold, 7d</span></div>
</div></body></html>
