<!-- @dsCard group="Colors" viewport="700x140" name="Brand red family" subtitle="The TEDx red. Used sparingly in the admin: one primary action, the active tab underline, focus rings." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Brand red</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:8px;flex-wrap:wrap}.col{display:grid;gap:8px}
.sw{border-radius:var(--radius-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box}
.mono{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.16em}
.hex{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink-4)}
.name{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-4)}
</style></head><body><div class="row" style="gap:10px">
<div class="col" style="gap:4px"><div class="sw" style="background:var(--red);color:#fff"><span class="mono">red</span></div><span class="hex">#e02214</span></div>
<div class="col" style="gap:4px"><div class="sw" style="background:var(--red-mid);color:#fff"><span class="mono">red mid</span></div><span class="hex">#b91404</span></div>
<div class="col" style="gap:4px"><div class="sw" style="background:var(--red-dark);color:#fff"><span class="mono">red dark</span></div><span class="hex">#8c0d05</span></div>
<div class="col" style="gap:4px"><div class="sw" style="background:var(--red-deep);color:#fff"><span class="mono">red deep</span></div><span class="hex">#2a0604</span></div>
<div class="col" style="gap:4px"><div class="sw" style="background:var(--red-bright);color:#fff"><span class="mono">red bright</span></div><span class="hex">#ff3626</span></div>
</div></body></html>
