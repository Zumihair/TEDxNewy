<!-- @dsCard group="Spacing" viewport="700x150" name="Motion & interaction" subtitle="One hover motion: translateY(-2px) on a tile. 300ms, ease-out-quint. Nothing bounces." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Motion</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:8px;flex-wrap:wrap}.col{display:grid;gap:8px}
.sw{border-radius:var(--radius-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box}
.mono{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.16em}
.hex{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink-4)}
.name{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-4)}
</style></head><body><div class="col" style="gap:10px">
<div style="display:grid;grid-template-columns:170px 210px 1fr;gap:12px;align-items:baseline"><span class="name">--ease-out-quint</span><span class="hex">cubic-bezier(0.22, 1, 0.36, 1)</span><span style="font-size:11.5px;color:var(--ink-3)">everything: hovers, tile lifts, panel opens</span></div><div style="display:grid;grid-template-columns:170px 210px 1fr;gap:12px;align-items:baseline"><span class="name">--ease-in-out-cubic</span><span class="hex">cubic-bezier(0.65, 0, 0.35, 1)</span><span style="font-size:11.5px;color:var(--ink-3)">the rare two-way transition</span></div><div style="display:grid;grid-template-columns:170px 210px 1fr;gap:12px;align-items:baseline"><span class="name">--dur-base</span><span class="hex">200ms</span><span style="font-size:11.5px;color:var(--ink-3)">colour changes (text, background, border)</span></div><div style="display:grid;grid-template-columns:170px 210px 1fr;gap:12px;align-items:baseline"><span class="name">--dur-slow</span><span class="hex">300ms</span><span style="font-size:11.5px;color:var(--ink-3)">tile lift + shadow together</span></div>
</div></body></html>
