<!-- @dsCard group="Spacing" viewport="700x210" name="Density in use" subtitle="Row 14/20, card 20, tile gap 10 — the dense-admin defaults, side by side" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Density</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:8px;flex-wrap:wrap}.col{display:grid;gap:8px}
.sw{border-radius:var(--radius-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box}
.mono{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.16em}
.hex{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink-4)}
.name{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-4)}
</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
<div>
<div class="name" style="margin-bottom:6px">list row · padding 14px 20px</div>
<div style="border:1px solid var(--line);border-radius:var(--radius-md);background:#fff;box-shadow:var(--shadow-sm)">
<div style="padding:14px 20px;"><div style="font-size:15px;font-weight:500;color:var(--ink)">TEDxNewy Signal 2026</div><div style="margin-top:4px;font-size:12px;color:var(--ink-3)">Sat 14 Nov · order 1</div></div><div style="padding:14px 20px;border-top:1px solid var(--line)"><div style="font-size:15px;font-weight:500;color:var(--ink)">Salon: Newcastle 2050</div><div style="margin-top:4px;font-size:12px;color:var(--ink-3)">Sat 14 Nov · order 2</div></div><div style="padding:14px 20px;border-top:1px solid var(--line)"><div style="font-size:15px;font-weight:500;color:var(--ink)">60-Second Talk Night</div><div style="margin-top:4px;font-size:12px;color:var(--ink-3)">Sat 14 Nov · order 3</div></div>
</div></div>
<div>
<div class="name" style="margin-bottom:6px">tiles · 84px, gap 10px</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
<div style="height:84px;box-sizing:border-box;border:2px solid var(--sec-yellow-border);border-radius:var(--radius-md);background:#fff;box-shadow:var(--shadow-sm);padding:12px;display:flex;flex-direction:column;justify-content:flex-end"><span style="font-size:13.5px;font-weight:500;letter-spacing:-0.01em">Events</span></div><div style="height:84px;box-sizing:border-box;border:2px solid var(--sec-coast-border);border-radius:var(--radius-md);background:#fff;box-shadow:var(--shadow-sm);padding:12px;display:flex;flex-direction:column;justify-content:flex-end"><span style="font-size:13.5px;font-weight:500;letter-spacing:-0.01em">Partners</span></div><div style="height:84px;box-sizing:border-box;border:2px solid var(--sec-green-border);border-radius:var(--radius-md);background:#fff;box-shadow:var(--shadow-sm);padding:12px;display:flex;flex-direction:column;justify-content:flex-end"><span style="font-size:13.5px;font-weight:500;letter-spacing:-0.01em">Admins</span></div><div style="height:84px;box-sizing:border-box;border:2px solid var(--sec-red-border);border-radius:var(--radius-md);background:#fff;box-shadow:var(--shadow-sm);padding:12px;display:flex;flex-direction:column;justify-content:flex-end"><span style="font-size:13.5px;font-weight:500;letter-spacing:-0.01em">Socials</span></div><div style="height:84px;box-sizing:border-box;border:2px solid var(--sec-grey-border);border-radius:var(--radius-md);background:#fff;box-shadow:var(--shadow-sm);padding:12px;display:flex;flex-direction:column;justify-content:flex-end"><span style="font-size:13.5px;font-weight:500;letter-spacing:-0.01em">Forms</span></div><div style="height:84px;box-sizing:border-box;border:2px solid var(--sec-yellow-border);border-radius:var(--radius-md);background:#fff;box-shadow:var(--shadow-sm);padding:12px;display:flex;flex-direction:column;justify-content:flex-end"><span style="font-size:13.5px;font-weight:500;letter-spacing:-0.01em">Talks</span></div>
</div></div>
</div></body></html>
