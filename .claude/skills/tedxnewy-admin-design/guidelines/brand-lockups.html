<!-- @dsCard group="Brand" viewport="700x180" name="Logo lockups" subtitle="Standard lockup, black and reversed. Never recolour outside red/black/white; never rebuild in another font." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Lockups</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:8px;flex-wrap:wrap}.col{display:grid;gap:8px}
.sw{border-radius:var(--radius-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box}
.mono{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.16em}
.hex{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink-4)}
.name{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-4)}
</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div style="background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:24px;display:flex;align-items:center;justify-content:center"><img src="../../../../public/brand/lockups/TEDxNewy-Standard-black.svg" alt="TEDxNewy" style="height:44px"></div>
<div style="background:var(--sidebar-bg);border-radius:var(--radius-md);padding:24px;display:flex;align-items:center;justify-content:center"><img src="../../../../public/brand/lockups/TEDxNewy-Standard-white.svg" alt="TEDxNewy" style="height:44px"></div>
</div>
<p style="margin:10px 0 0;font-size:11.5px;color:var(--ink-3)">Salon and Youth event lockups exist in the same three colourways — see <code style="font-family:var(--font-mono);font-size:10.5px">public/brand/lockups/</code>.</p></body></html>
