<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="6 small controls · 10 stat chips · 12 cards, inputs, modals · pill for every button and badge" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:8px;flex-wrap:wrap}.col{display:grid;gap:8px}
.sw{border-radius:var(--radius-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box}
.mono{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.16em}
.hex{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink-4)}
.name{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-4)}
</style></head><body><div class="row" style="gap:14px;align-items:flex-end">
<div class="col" style="gap:6px"><div style="width:72px;height:56px;background:#fff;border:1px solid var(--line-input);border-radius:6px"></div><span class="name">6px</span><span class="hex">--radius-sm</span></div><div class="col" style="gap:6px"><div style="width:72px;height:56px;background:#fff;border:1px solid var(--line-input);border-radius:10px"></div><span class="name">10px</span><span class="hex">--radius-statchip</span></div><div class="col" style="gap:6px"><div style="width:72px;height:56px;background:#fff;border:1px solid var(--line-input);border-radius:12px"></div><span class="name">12px</span><span class="hex">--radius-md</span></div><div class="col" style="gap:6px"><div style="width:72px;height:56px;background:#fff;border:1px solid var(--line-input);border-radius:24px"></div><span class="name">24px</span><span class="hex">--radius-lg</span></div><div class="col" style="gap:6px"><div style="width:120px;height:56px;background:#fff;border:1px solid var(--line-input);border-radius:9999px"></div><span class="name">9999px</span><span class="hex">--radius-pill</span></div>
</div></body></html>
