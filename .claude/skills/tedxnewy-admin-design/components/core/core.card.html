<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--surface-page)}.grp{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.lbl{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;color:var(--ink-4)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Badge, TabBar, Icon, Flash } = window.TEDxNewyAdminDesignSystem_bb30ae;
const I = (n) => <Icon name={n} size={14} strokeWidth={2.25} />;
function Demo() {
  const [tab, setTab] = React.useState("drafts");
  return (
    <div style={{display:"grid",gap:"14px"}}>
      <div className="grp">
        <Button variant="primary" icon={I("Plus")}>Add partner</Button>
        <Button variant="secondary" icon={I("Download")}>Export</Button>
        <Button variant="dark">Confirm</Button>
        <Button variant="primary" pending>Saving</Button>
        <Button variant="secondary" disabled>Disabled</Button>
      </div>
      <div className="grp">
        <span className="lbl">In a row</span>
        <Button variant="row" icon={I("Pencil")}>Edit</Button>
        <Button variant="row" icon={I("Users")}>Attendees</Button>
        <Button variant="danger" icon={I("Trash2")}>Delete</Button>
        <IconButton ariaLabel="Move up"><Icon name="ArrowUp" size={16} /></IconButton>
        <IconButton ariaLabel="Download"><Icon name="Download" size={16} /></IconButton>
        <IconButton ariaLabel="Delete" tone="danger"><Icon name="Trash2" size={16} /></IconButton>
      </div>
      <div className="grp">
        <Badge tone="draft">Draft</Badge>
        <Badge tone="scheduled">Scheduled</Badge>
        <Badge tone="live">Posted</Badge>
        <Badge tone="neutral">Past</Badge>
        <Badge tone="soon">Announced</Badge>
        <Badge tone="red">Failed</Badge>
      </div>
      <TabBar tabs={[{key:"drafts",label:"Drafts",count:6},{key:"scheduled",label:"Scheduled",count:2},{key:"sent",label:"Sent"}]} active={tab} onSelect={setTab} />
      <Flash tone="ok">Partner saved.</Flash>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
